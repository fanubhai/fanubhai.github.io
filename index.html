<title>Faizan Abbas — Web Developer & Graphic Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>


:root{--bg:#fff8fa;--surface:#fff;--ink:#2b2230;--mute:#6f6475;--pink:#e8588a;--pink2:#f9a8c4;--soft:#fde6ee;--line:#f3d3df;--shadow:0 18px 40px rgba(232,88,138,.15);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1220;--surface:#251a2d;--ink:#fbeef3;--mute:#c4b3cc;--soft:#33213b;--line:#43304c;--shadow:0 18px 40px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1220;--surface:#251a2d;--ink:#fbeef3;--mute:#c4b3cc;--soft:#33213b;--line:#43304c;--shadow:0 18px 40px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.15}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:14px 6%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:19;background:var(--bg)}
.brand{font-family:'Playfair Display',serif;font-size:22px;font-weight:700}.brand b{color:var(--pink)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{padding:8px 16px;border-radius:30px;font-size:14px;font-weight:500;color:var(--mute);transition:.3s;cursor:pointer}
nav a:hover{color:var(--pink)}nav a.on{background:var(--pink);color:#fff}
.page{display:none;animation:in .5s ease}.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
section{padding:70px 6%;max-width:1150px;margin:auto}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:50px;align-items:center;min-height:78vh}
.tag{display:inline-block;background:var(--soft);color:var(--pink);padding:6px 16px;border-radius:30px;font-size:13px;font-weight:500;margin-bottom:18px}
.hero h1{font-size:clamp(38px,6vw,64px)}.hero h1 span{color:var(--pink);font-style:italic}
.hero p{color:var(--mute);margin:20px 0 30px;max-width:520px}
.btn{display:inline-block;padding:14px 32px;border-radius:40px;background:var(--pink);color:#fff;font-weight:500;border:0;cursor:pointer;font-size:15px;font-family:inherit;transition:.3s;box-shadow:var(--shadow)}
.btn:hover{transform:translateY(-3px)}.btn.o{background:transparent;color:var(--pink);border:2px solid var(--pink);box-shadow:none;margin-left:10px}
.photo{position:relative;justify-self:center;width:min(100%,340px)}
.photo::before{content:"";position:absolute;inset:18px -18px -18px 18px;border-radius:200px 200px 30px 30px;background:linear-gradient(160deg,var(--pink2),var(--pink));opacity:.55}
.photo img{position:relative;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:200px 200px 30px 30px;box-shadow:var(--shadow)}
.title{font-size:clamp(30px,4vw,42px);text-align:center;margin-bottom:12px}
.sub{text-align:center;color:var(--mute);max-width:560px;margin:0 auto 46px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;transition:.4s}
.card:hover{transform:translateY(-8px);box-shadow:var(--shadow)}
.ico{width:50px;height:50px;border-radius:15px;background:var(--soft);display:grid;place-items:center;font-size:24px;margin-bottom:16px}
.card h3{font-size:20px;margin-bottom:8px}.card p{color:var(--mute);font-size:14.5px}
.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:50px;align-items:center}
.about p{color:var(--mute);margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chips span{background:var(--soft);color:var(--pink);padding:7px 16px;border-radius:30px;font-size:13.5px;font-weight:500}
.bar{margin-bottom:18px}.bar div:first-child{display:flex;justify-content:space-between;font-size:14px;font-weight:500;margin-bottom:6px}
.bar i{display:block;height:8px;border-radius:8px;background:var(--soft);overflow:hidden}.bar i b{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--pink2),var(--pink))}
.proj{padding:0;overflow:hidden}
.thumb{height:170px;display:grid;place-items:center;font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:#fff;text-align:center;padding:10px}
.pb{padding:22px 26px 26px}.pb small{color:var(--pink);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.pb h3{font-size:20px;margin:4px 0 8px}.pb p{color:var(--mute);font-size:14px}
.ct{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px}
.info a{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px;transition:.3s;overflow-wrap:anywhere}
.info a:hover{border-color:var(--pink);transform:translateX(6px)}
.info .ico{margin:0;flex:none}.info small{color:var(--mute);display:block;font-size:12.5px}
form{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow)}
form input,form textarea{width:100%;padding:14px 18px;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;font:inherit;background:var(--bg);color:var(--ink)}
form input:focus,form textarea:focus{outline:2px solid var(--pink2)}
footer{text-align:center;padding:30px 6%;color:var(--mute);font-size:13.5px;border-top:1px solid var(--line)}
@media(max-width:800px){.hero,.about,.ct{grid-template-columns:1fr}.hero{text-align:center;min-height:auto}.hero p{margin-inline:auto}.photo{order:-1;width:min(70%,280px)}.btn.o{margin:12px 0 0}header{flex-direction:column;gap:8px}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;padding-top:0;padding-bottom:0}
.stat{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}
.stat b{display:block;font:700 34px 'Playfair Display',serif;color:var(--pink)}.stat span{font-size:13.5px;color:var(--mute)}
.steps .card{position:relative}.num{position:absolute;top:14px;right:22px;font:700 42px 'Playfair Display',serif;color:var(--line)}
.cta{margin:30px auto 70px;max-width:1050px;width:calc(100% - 12%);border-radius:30px;background:linear-gradient(135deg,var(--pink),#f58db3);color:#fff;text-align:center;padding:56px 6%;box-shadow:var(--shadow)}
.cta h2{font-size:clamp(26px,4vw,38px)}.cta p{opacity:.95;margin:12px 0 26px}.cta .btn{background:#fff;color:var(--pink)}
.role{color:var(--pink);font-weight:600}.cursor{border-right:2px solid var(--pink);margin-left:2px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{border-color:transparent}}
.badge{position:absolute;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:8px 16px;font-size:13px;font-weight:500;box-shadow:var(--shadow);animation:fl 4s ease-in-out infinite;white-space:nowrap}.b1{top:12%;left:-34px}.b2{bottom:14%;right:-28px;animation-delay:1.5s}@keyframes fl{50%{transform:translateY(-10px)}}
.filters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:34px}.filters button{padding:9px 22px;border-radius:30px;border:1px solid var(--line);background:var(--surface);color:var(--mute);font:500 14px Poppins,sans-serif;cursor:pointer;transition:.3s}.filters button.on,.filters button:hover{background:var(--pink);color:#fff;border-color:var(--pink)}
.proj.hide{display:none}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.tags i{font-style:normal;font-size:12px;background:var(--soft);color:var(--pink);padding:3px 11px;border-radius:20px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 22px;margin-bottom:12px}.faq summary{cursor:pointer;font-weight:500}.faq p{color:var(--mute);margin-top:10px;font-size:14.5px}
.wa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:#25d366;color:#fff;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;box-shadow:0 10px 25px rgba(37,211,102,.45);transition:.3s}.wa:hover{transform:scale(1.1)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none;transition:.4s}
@media(max-width:800px){.badge{display:none}}

.more{display:inline-block;margin-top:14px;color:var(--pink);font-weight:500;font-size:14px}
.fab{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border:0;border-radius:30px;padding:12px 20px;font:500 14px Poppins,sans-serif;cursor:pointer;box-shadow:var(--shadow)}
.ap{position:fixed;top:0;right:0;bottom:0;width:min(450px,100%);z-index:50;background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(0,0,0,.25);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ap.open{display:flex}.aph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.aph select{flex:1;min-width:120px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;text-transform:capitalize}
.sv{padding:9px 16px;font-size:13px}.apb{flex:1;overflow:auto;padding:16px}
.af{margin-bottom:12px}.al{display:block;font-size:12px;font-weight:600;color:var(--mute);text-transform:capitalize;margin-bottom:4px}
.af input:not([type=color]):not([type=file]),.af textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:var(--bg);color:var(--ink)}
.af fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 10px 0}.ar{display:flex;gap:6px;align-items:flex-start}.ar>.af{flex:1}
.ab{background:var(--soft);color:var(--pink);border:0;border-radius:10px;padding:8px 12px;font:500 13px Poppins,sans-serif;cursor:pointer}.ab.add{margin-bottom:14px}
.pv{display:block;max-width:120px;border-radius:10px;margin:6px 0}


.tg{background:var(--soft);border:0;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:17px}
.bar i b{width:0;transition:width 1.4s ease}.bar.in i b{width:var(--w)}
.prices .card{display:flex;flex-direction:column;position:relative}.price .amt{font:700 26px 'Playfair Display',serif;color:var(--pink);margin:6px 0 14px}.price ul{list-style:none;margin-bottom:22px;flex:1}.price li{font-size:14px;color:var(--mute);padding:5px 0 5px 24px;position:relative}.price li::before{content:"✓";position:absolute;left:0;color:var(--pink);font-weight:700}.pbdg{position:absolute;top:-12px;right:20px;background:var(--pink);color:#fff;font-size:12px;padding:4px 14px;border-radius:20px}.price .btn{text-align:center;box-shadow:none}
.srch{display:block;margin:-14px auto 30px;width:min(100%,360px);padding:12px 20px;border:1px solid var(--line);border-radius:30px;background:var(--surface);color:var(--ink);font:inherit}
.dm{padding:9px 22px;font-size:13.5px;margin-top:14px}.cs{margin-top:12px;font-size:14px}.cs summary{cursor:pointer;color:var(--pink);font-weight:500}.cs p{color:var(--mute);margin-top:6px}
.gal{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.gi{aspect-ratio:1;border-radius:20px;position:relative;overflow:hidden;color:#fff;display:flex;align-items:flex-end;cursor:zoom-in;transition:.4s}.gi:hover{transform:scale(1.03)}.gi.hide{display:none}.gi figcaption{width:100%;padding:30px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.55));font-weight:500;font-size:14px}.gi small{display:block;font-size:12px;opacity:.85}
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:20px;cursor:zoom-out}.lb img{max-width:100%;max-height:100%;border-radius:14px}
form select{width:100%;padding:14px 18px;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;font:inherit;background:var(--bg);color:var(--ink)}form h3{margin-bottom:16px}form .btn.o{margin:8px 0 0}
.soc{margin-bottom:10px}.soc a{margin:0 10px;color:var(--pink);font-weight:500}
</style>

let sch0;const sch=()=>{clearTimeout(sch0);sch0=setTimeout(render,200)};
function shrink(f,max,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=$('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(f)}
function ed(p,k,lab,redo){const v=p[k],w=$('div','af'),nice=lab||String(k).replace(/([A-Z])/g,' $1');
if(Array.isArray(v)){w.append($('label','al',nice));
v.forEach((x,i)=>{const r=$('div','ar'),l=(x&&typeof x==='object'&&(x.title||x.name||x.question||x.label||x.value))||'#'+(i+1);r.append(ed(v,i,l,redo));
const d=$('button','ab','✕');d.type='button';d.onclick=()=>{v.splice(i,1);redo();sch()};r.append(d);w.append(r)});
const a=$('button','ab add','+ Add');a.type='button';a.onclick=()=>{const l=v[v.length-1];v.push(l&&typeof l==='object'?JSON.parse(JSON.stringify(l,(kk,x)=>kk==='image'?'':x)):'');redo();sch()};w.append(a)}
else if(v&&typeof v==='object'){const f=$('fieldset');w.append($('label','al',nice));Object.keys(v).forEach(kk=>f.append(ed(v,kk,null,redo)));w.append(f)}
else if(k==='photo'||k==='image'){w.append($('label','al',nice+' (image)'));if(v)w.append($('img','pv')).src=v;
const i=$('input');i.type='file';i.accept='image/*';i.onchange=()=>i.files[0]&&shrink(i.files[0],k==='photo'?800:900,u=>{p[k]=u;redo();sch()});w.append(i);
if(v){const x=$('button','ab','Remove');x.type='button';x.onclick=()=>{p[k]='';redo();sch()};w.append(x)}}
else if(typeof v==='number'){const i=$('input');i.type='number';i.value=v;i.oninput=()=>{p[k]=+i.value;sch()};w.append($('label','al',nice),i)}
else{const long=String(v).length>60||/text|intro|answer/i.test(k),i=$(long?'textarea':'input');if(/^#[0-9a-f]{6}$/i.test(v))i.type='color';i.value=v;if(long)i.rows=3;i.oninput=()=>{p[k]=i.value;sch()};w.append($('label','al',nice),i)}
return w}

btn.textContent='Saving…';const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.removeAttribute('data-theme');c.querySelector('#theme').textContent='';c.querySelector('#adm')?.remove();

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const msgSt=t=>{const s=document.querySelector('#adm .st');if(s)s.textContent=t};
async function save(btn){

function admin(){if(document.getElementById('adm'))return;
const w=$('div'),fab=$('button','fab','⚙️ Admin'),ap=$('div','ap open');w.id='adm';
ap.innerHTML='<div class="aph"><b>Admin</b><select></select><button class="btn sv" type="button">Save & Publish</button><button class="ab" type="button">✕</button><div class="st" style="width:100%;font-size:12.5px;color:var(--pink)"></div></div><div class="apb"></div>';

Object.keys(D).filter(k=>k[0]!=='_').forEach(k=>sel.add(new Option(k.replace(/([A-Z])/g,' $1'),k)));sel.add(new Option('🔑 change password','_pw'));

sel.onchange=()=>{cur=sel.value;build()};fab.onclick=()=>ap.classList.add('open');
